name: Autonomous prospective release watch

on:
  schedule:
    - cron: "23 4 2 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: autonomous-prospective-release-watch
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e .
      - name: Audit frozen no-human watch contract
        run: python -m pipeline.benchmark.autonomous_release_watch audit
      - name: Observe only the next sequential official release
        run: python -m pipeline.benchmark.autonomous_release_watch probe
      - name: Commit a newly observed immutable inventory
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- benchmarks/autonomous/releases)" ]]; then
            exit 0
          fi
          git config user.name "lacuna-release-watch[bot]"
          git config user.email "lacuna-release-watch[bot]@users.noreply.github.com"
          git add -- benchmarks/autonomous/releases
          git commit -m "data: pin next prospective PubMed release"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"
