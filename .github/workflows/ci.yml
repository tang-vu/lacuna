name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Validate curated sources
        run: python -m pipeline.export.validate_curated
      - name: Validate v3 draft benchmark structure
        run: python -m pipeline.benchmark.validate_v3
      - name: Validate v3 metric-blind candidate intake
        run: python -m pipeline.benchmark.validate_candidates
      - name: Validate v3 metric-blind negative-control queue
        run: python -m pipeline.benchmark.negative_controls
      - name: Validate v3 historical source access record
        run: python -m pipeline.benchmark.validate_sources
      - name: Validate preserved MBR repository metadata
        run: python -m pipeline.benchmark.mbr_capture
      - name: Validate active autonomous prospective contract
        run: python -m pipeline.benchmark.validate_autonomous_prospective
      - name: Validate autonomous release watcher
        run: |
          python -m pipeline.benchmark.autonomous_release_watch audit
          python -m pipeline.benchmark.autonomous_release_watch status
      - name: Validate frozen empirical evidence protocol
        run: |
          python -m pipeline.evidence.replicated_association_v1 audit-protocol
          python -m pipeline.evidence.replicated_association_v1 audit-result
      - name: Run tests available in a clean clone
        run: python -m pytest -m "not slow"
      - name: Verify committed artifact integrity
        run: python -m pipeline.export.verify_artifacts

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
